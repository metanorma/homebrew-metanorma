name: macos

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-macos:
    name: Install macOS
    strategy:
      fail-fast: false
      matrix:
        # macos-15: arm64. The macos-15-intel leg parks: Homebrew on the
        # Intel runner (Tier 3, /usr/local prefix) crashes in its own
        # keg_relocate while installing the formula's DEPENDENCIES — the
        # packed binary never stages, so the leg tests brew-on-Intel, not
        # us. The darwin-x86_64 binary's compile proof lives in
        # packed-metanorma's press leg; Intel users are served by the
        # formula's on_intel resource regardless.
        os: [ macos-15 ]
        formula: [ metanorma ]
        experimental: [ false ]
        # include:
        #   - formula: metanorma-dev
        #     os: macos-15
        #     experimental: true
        #     executable: metanorma
        #   - formula: metanorma-dev
        #     os: macos-15-intel
        #     experimental: true
        #     executable: metanorma

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    concurrency:
      group: '${{ github.workflow }}-${{ matrix.os }}-${{ matrix.formula }}-${{ github.head_ref || github.ref_name }}'
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.metanorma-ietf-workgroup-cache.json
          key: metanorma-ietf-workgroup-cache
          restore-keys: metanorma-ietf-workgroup-cache

      - run: brew update-reset

      - name: Add local tap for testing
        run: |
          brew tap metanorma/metanorma $GITHUB_WORKSPACE
          # The tap ships both a formula and a cask named metanorma; newer
          # Homebrew refuses to load the cask from an untrusted tap, which
          # the ambiguous uninstall below otherwise trips on.
          brew trust metanorma/metanorma

      - run: |
          brew install --build-from-source --verbose metanorma/metanorma/${{ matrix.formula }}
        # To ignore potential: The `brew link` step did not complete successfully
        #continue-on-error: true

      - run: brew audit --strict --formula metanorma/metanorma/${{ matrix.formula }}
        # To ignore potential: GitHub API Error: API rate limit exceeded for
        #  Files were found with references to the Homebrew shims directory.
        #    The offending files are:
        #      libexec/gems/sqlite3-1.7.3/ext/sqlite3/tmp/arm64-apple-darwin24.4.0/ports/sqlite3/3.45.2/sqlite-autoconf-3450200/config.log
        continue-on-error: ${{ matrix.experimental }}

      - run: which ${{ matrix.executable || matrix.formula }}

      - run: brew test --verbose metanorma/metanorma/${{ matrix.formula }}
        env:
          HOMEBREW_TEST_TIMEOUT_SECS: "900"
        #continue-on-error: true # Because ietf test fails anyway

      - run: brew uninstall metanorma/metanorma/${{ matrix.formula }}

  test-cask:
    name: Cask (pkg)
    # The pkg ships Apple silicon only; Intel hosts are excluded by the
    # cask's depends_on arch: :arm64, which brew enforces at install.
    # The smoke exports the workflow's GITHUB_TOKEN: the runtime
    # resolution's factory-registry read rides the api.github.com
    # contents API (60 req/h unauthenticated — exhausted on shared
    # runner IPs), which was the flake behind
    # metanorma/packed-metanorma#281. A red leg from here is a genuine
    # product signal again.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - run: brew update-reset

      - name: Add local tap for testing
        run: |
          brew tap metanorma/metanorma $GITHUB_WORKSPACE
          # The tap ships both a formula and a cask named metanorma; newer
          # Homebrew refuses to load the cask from an untrusted tap, which
          # the ambiguous uninstall below otherwise trips on.
          brew trust metanorma/metanorma

      - name: Install the cask
        run: brew install --cask metanorma/metanorma/metanorma

      - name: Wait for the detached seed, then smoke the shim
        env:
          # The smoke's runtime resolution reads the factory registry via
          # the api.github.com contents API: 60 req/h unauthenticated, and
          # shared runner IPs routinely start near-exhausted (the flake
          # behind metanorma/packed-metanorma#281). The workflow's own token
          # raises the budget (the resolver's ambient tier already honors
          # it) — CI stays deterministic while the user-facing refusal gains
          # the per-source reasons + the token hint in tamatebako/tebako#978.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The pkg's postinstall seeds the payload DETACHED (a network
          # prefetch PackageKit's script budget would otherwise kill), and
          # warms the runtime into the root-owned machine home. The poll's
          # primary condition is the seed's own completion marker in
          # seed.log: the store's effects land BEFORE the warm finishes —
          # dispatching then races the root-owned runtime install lock
          # (EACCES, os error 13; observed when the factory published a new
          # runtime line mid-flight and the warm's download outran the
          # store-effect checks). 1800 s: the seed pulls the recursive
          # closure (payloads + the openjdk/python/ruby runtime pairs) over
          # the runner's shared egress — a 249 MB payload at 2.7 MB/s alone
          # eats ~90 s and the closure is several hundred MB more (the 900 s
          # budget died mid-fetch on a slow runner, seed healthy throughout).
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            seeded=1
            sudo grep -q "seed: complete" /opt/metanorma/home/seed.log 2>/dev/null || seeded=0
            [ -f /opt/metanorma/home/config.yaml ] || seeded=0
            [ -d /opt/metanorma/home/payloads/metanorma ] || seeded=0
            [ -x /opt/metanorma/home/shims/metanorma ] || seeded=0
            [ -n "$(ls -A /opt/metanorma/home/runtimes 2>/dev/null)" ] || seeded=0
            [ "$seeded" = 1 ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::the pkg's detached seed did not land within 900s — seed.log tail:"
              sudo tail -30 /opt/metanorma/home/seed.log 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done
          # After the warm, a user dispatch is read-only against the
          # root-owned machine home.
          /opt/metanorma/home/shims/metanorma version | grep -q "Metanorma::Cli"

      - run: brew uninstall --cask metanorma/metanorma/metanorma

      - name: Uninstall removed the install root
        run: test ! -e /opt/metanorma
