name: linux

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-linux:
    name: Install on Linux
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      max-parallel: 6
      matrix:
        # Test all options. The arm legs are dropped for now: the current
        # packed-metanorma release ships no linux-gnu-arm64 binary and its
        # musl-arm64 binary is dynamically linked against musl (needs
        # /lib/ld-musl-aarch64.so.1, absent on Ubuntu), so there is no
        # runnable artifact for these hosts until metanorma/packed-metanorma#280.
        os: [ ubuntu-24.04, ubuntu-22.04 ]
        formula: [ metanorma ]
        experimental: [ false ]
        # include:
        #   # One x64 and one arm enough?
        #   - os: ubuntu-24.04
        #     formula: metanorma-dev
        #     executable: metanorma
        #     experimental: true
        #   - os: ubuntu-22.04-arm
        #     formula: metanorma-dev
        #     executable: metanorma
        #     experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.metanorma-ietf-workgroup-cache.json
          key: metanorma-ietf-workgroup-cache
          restore-keys: metanorma-ietf-workgroup-cache

      # https://docs.brew.sh/Homebrew-on-Linux
      - run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          test -d ~/.linuxbrew && eval "$(~/.linuxbrew/bin/brew shellenv)"
          test -d /home/linuxbrew/.linuxbrew && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          test -r ~/.bash_profile && echo "eval \"\$($(brew --prefix)/bin/brew shellenv)\"" >> ~/.bash_profile
          echo "eval \"\$($(brew --prefix)/bin/brew shellenv)\"" >> ~/.profile
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - run: brew update-reset

      - run: |
          sudo apt-get update -y
          sudo apt-get install -y libpng16-16 libfreetype6 libfontconfig

      - name: Add local tap for testing
        run: |
          brew tap metanorma/metanorma $GITHUB_WORKSPACE
          # The tap ships both a formula and a cask named metanorma; newer
          # Homebrew refuses to load the cask from an untrusted tap, which
          # the ambiguous uninstall below otherwise trips on.
          brew trust metanorma/metanorma

      - run: brew install --build-from-source --verbose --include-test metanorma/metanorma/${{ matrix.formula }}
        # To ignore potential: The `brew link` step did not complete successfully
        # continue-on-error: true

      - run: which ${{ matrix.executable || matrix.formula }}

      - run: brew test --verbose metanorma/metanorma/${{ matrix.formula }}
        # continue-on-error: true # Because ietf test fails anyway

      - run: brew uninstall metanorma/metanorma/${{ matrix.formula }}
